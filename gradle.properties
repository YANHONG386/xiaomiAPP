# 时迹项目 —— Gradle 全局配置

# JVM 内存：安卓构建耗内存，给足 4G
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# 使用安卓扩展库（AndroidX）
android.useAndroidX=true

# 并行构建（多模块时提速，本项目单模块影响不大）
org.gradle.parallel=true

# 配置缓存（加速重复构建）
# 关闭原因：本项目位于中文路径「桌面」，配置缓存与测试 worker 组合在
# Windows 中文路径下有已知 bug（GradleWorkerMain ClassNotFoundException），
# 关闭后测试可正常运行；构建速度影响可接受（单模块小项目）
org.gradle.configuration-cache=false

# Kotlin 代码风格：使用官方默认
kotlin.code.style=official

# 统一输出编码，避免 Windows 中文乱码
org.gradle.console=plain

# 项目位于中文路径（桌面）下：跳过 AGP 的路径检查。
# 本项目是纯 Kotlin+Compose，无原生代码，该检查主要针对 NDK 构建，关闭无副作用。
# 若后续出现原生编译相关的中文路径错误，需将项目移动到纯英文目录。
android.overridePathCheck=true

# compileSdk=37 超出 AGP 8.13 的官方支持范围（其最高为 36）→ 抑制版本警告。
# 原因：本机无法访问 dl.google.com 下载 android-36 平台，只能使用已装的 android-37。
android.suppressUnsupportedCompileSdk=37,37.0

# 禁用 AGP 自动下载 SDK 组件（本机无法访问 dl.google.com，拉取组件清单会卡死；
# 所需组件 platforms;android-37 / build-tools;35.0.0 已本地安装完整，无需联网）
android.builder.sdkDownload=false
